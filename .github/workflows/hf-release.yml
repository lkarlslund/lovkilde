# The daily Hugging Face release: update the mirror from the published state, build the next
# artifact, publish it. Everything happens in scripts/hf-release.sh; this only provides a
# runner, Go, the hf command and the secrets.
#
# Repository settings it needs:
#   secret   HF_REPO   the dataset repository the releases live in: owner/name or hf://owner/name
#   secret   HF_TOKEN  a Hugging Face token with write access to it
name: Hugging Face release

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "layer (default), patch (a whole artifact), or full (rebuild from the XML archive)"
        type: choice
        options: [layer, patch, full]
        default: layer
      squash:
        description: "squash the dataset's history into one commit after publishing"
        type: boolean
        default: false

# One release at a time: two would both continue the same published state.
concurrency:
  group: hf-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install the hf command
        run: python3 -m pip install --user --upgrade huggingface_hub
      - name: Today
        id: today
        run: echo "day=$(date -u +%d)" >> "$GITHUB_OUTPUT"
      - name: Release
        run: scripts/hf-release.sh
        env:
          HF_REPO: ${{ secrets.HF_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODE: ${{ inputs.mode || 'layer' }}
      # Every release is a commit and the Hub keeps every file one names, so once a month (and
      # when asked) the history is squashed into the current release. Here, after publishing and
      # in the same job, so it never rewrites the branch while a release is being committed.
      - name: Squash the history (monthly)
        if: (github.event_name == 'schedule' && steps.today.outputs.day == '01') || inputs.squash
        run: scripts/hf-squash.py
        env:
          HF_REPO: ${{ secrets.HF_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
