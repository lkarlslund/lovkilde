# The daily server build: lovkilde for Linux, macOS and Windows on amd64 and arm64, published as
# GitHub release rNNNNN, where NNNNN is the number of commits on main. The newest is the
# repository's latest release, which is what a running lovkilde checks against and downloads. A
# commit that already has its release builds nothing.
#
# A build is published only once the Hugging Face dataset holds an artifact in the document model
# it reads (compiled.ModelVersion): a program that changes the model would otherwise reach servers
# before any data it can read, and refuse to start on the artifact they have. It also runs after
# each dataset release, so a build waiting for its model follows the release that publishes it.
name: Server builds

on:
  schedule:
    - cron: "41 2 * * *" # daily 02:41 UTC, before the dataset release
  workflow_run:
    workflows: ["Hugging Face release"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: server-builds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Does this commit have its release?
        id: new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="r$(printf %05d "$(git rev-list --count HEAD)")"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if gh release view "$release" >/dev/null 2>&1 && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "$release is published already"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Is the dataset in this build's document model published?
        id: model
        if: steps.new.outputs.build == 'true'
        env:
          HF_REPO: ${{ secrets.HF_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          model="$(sed -n 's/^const ModelVersion = \([0-9]*\)$/\1/p' internal/compiled/model.go)"
          repo="${HF_REPO#hf://}"
          published="$(curl -fsSL ${HF_TOKEN:+-H "Authorization: Bearer $HF_TOKEN"} \
            "https://huggingface.co/datasets/$repo/resolve/main/latest.json" | jq -c '[.model] + [.older[]?.model]')"
          echo "this build reads document model $model; the dataset publishes models $published"
          if jq -e --argjson m "$model" 'index($m) != null' <<<"$published" >/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not published: no dataset in document model $model yet. The build follows the dataset release that publishes it."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v6
        if: steps.model.outputs.publish == 'true'
        with:
          go-version-file: go.mod
      - name: Test
        if: steps.model.outputs.publish == 'true'
        run: go test ./...
      - name: Build
        if: steps.model.outputs.publish == 'true'
        run: scripts/build-server.sh dist
      - name: Publish the release
        if: steps.model.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.new.outputs.release }}
        run: |
          notes="Lovkilde $RELEASE. Hent filen til dit styresystem, pak den ud og start lovkilde: hjemmesiden åbner i din browser, og programmet henter selv lovteksterne. En kørende Lovkilde finder og henter selv nye versioner.

          > [!CAUTION]
          > **Uofficiel kopi – ikke den officielle Retsinformation og ikke juridisk rådgivning.** Teksterne hentes automatisk fra retsinformation.dk og behandles maskinelt, og de kan indeholde fejl. Især konsoliderede tekster (en lov som gældende på en dato) laves automatisk af dette program, ikke af Civilstyrelsen. Al brug sker på eget ansvar. Kontrollér altid mod den officielle udgave på retsinformation.dk.
          >
          > Projektet har ingen tilknytning til Civilstyrelsen eller retsinformation.dk. Programmet leveres, som det er, uden garanti af nogen art, og forfatterne påtager sig intet ansvar for tab eller skade som følge af brugen."
          # Created with its files in one step, so the latest release never lacks them.
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release edit "$RELEASE" --notes "$notes"
            gh release upload "$RELEASE" dist/* --clobber
          else
            gh release create "$RELEASE" dist/* --target "$GITHUB_SHA" --title "Lovkilde $RELEASE" --notes "$notes" --latest
          fi
